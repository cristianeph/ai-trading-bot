version: "3.9"

services:
  model:
    build:
      context: .
      dockerfile: model/model.Dockerfile
    container_name: crypto-model
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: bot/bot.Dockerfile
    container_name: crypto-bot
    depends_on:
      - model
    env_file:
      - .env
    restart: unless-stopped